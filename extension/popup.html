<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>GrowthEngine Auto-Pilot Suite</title>
  <style>
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 900;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .profile-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #10b981;
      object-fit: cover;
      background: #334155;
    }
    .info { flex: 1; }
    .name { font-size: 13px; font-weight: 800; color: #fff; }
    .uid { font-size: 11px; color: #94a3b8; font-family: monospace; margin-top: 2px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #10b981;
      margin-top: 4px;
      font-weight: 700;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
    
    .btn-action {
      display: block;
      width: 100%;
      text-align: center;
      background: #059669;
      color: #fff;
      text-decoration: none;
      padding: 9px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      box-sizing: border-box;
      border: none;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.2s;
    }
    .btn-action:hover { background: #047857; }
    
    .btn-secondary {
      background: #2563eb;
    }
    .btn-secondary:hover { background: #1d4ed8; }

    .accounts-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      max-height: 180px;
      overflow-y: auto;
    }
    .box-title {
      font-size: 11px;
      font-weight: 800;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .acc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .switch-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      font-weight: 700;
    }
    .switch-btn:hover { background: #0369a1; }

    .campaign-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid #10b981;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="logo-badge">⚡</div>
      <div>
        <div style="font-size:13px; font-weight:800;">GrowthEngine Auto-Pilot</div>
        <div style="font-size:10px; color:#94a3b8;">نظام فيوفيد للتبديل التلقائي</div>
      </div>
    </div>
    <span id="acc-count-badge" style="font-size:10px; background:#334155; padding:2px 6px; border-radius:10px;">0 حسابات</span>
  </div>

  <!-- Campaign Live Status (if running) -->
  <div class="campaign-box" id="campaign-box">
    <div style="font-size:11px; font-weight:800; color:#10b981; margin-bottom:4px;">🚀 الحملة التلقائية تعمل حالياً:</div>
    <div id="campaign-msg" style="font-size:11px; color:#e2e8f0; line-height:1.4;">جارٍ التنفيذ...</div>
  </div>

  <!-- Current Active Profile -->
  <div class="profile-card" id="card">
    <img src="https://static.xx.fbcdn.net/rsrc.php/v3/yo/r/UlIqmHJn-SK.gif" class="avatar" id="avatar" alt="Avatar">
    <div class="info">
      <div class="name" id="name">جاري فحص الحساب...</div>
      <div class="uid" id="uid">يرجى الانتظار...</div>
      <div class="status-pill" id="status-pill"><span class="dot"></span> جاري الاتصال...</div>
    </div>
  </div>

  <button class="btn-action" id="capture-btn">
    💾 حفظ جلسة هذا الحساب في قائمة التبديل
  </button>

  <!-- Saved Accounts List for 1-Click Switch -->
  <div class="accounts-box">
    <div class="box-title">
      <span>الحسابات المحفوظة للتبديل:</span>
      <span style="color:#10b981;" id="saved-count">0</span>
    </div>
    <div id="saved-list">
      <div style="color:#64748b; font-size:10px; text-align:center; padding:10px;">لم يتم حفظ أي حساب بعد. اضغط زر الحفظ أعلاه لحفظ الحساب المفتوح.</div>
    </div>
  </div>

  <a href="http://localhost:3000/growth-engine" target="_blank" class="btn-action btn-secondary">
    🎭 فتح لوحة التحكم الرئيسية (Dashboard)
  </a>

  <script src="popup.js"></script>
</body>
</html>
